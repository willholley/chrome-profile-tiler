# Publishes a GitHub release for every push to main.
#
# The version is worked out from the commit messages since the last release:
#   "feat!: ..." or "BREAKING CHANGE" -> major,  "feat: ..." -> minor,  anything else -> patch.
# With squash merges the PR title becomes the commit message, so start PR titles with
# feat: or fix: as appropriate. The first release is 1.0.0.
#
# Each release has two files attached, which the tool downloads from the stable
# .../releases/latest/download/<file> URLs:
#   stagehand.zip  the tool, in a "stagehand" folder, with a VERSION file inside
#   VERSION        just the version number, so the tool can check for updates cheaply

name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Work out the next version
        id: version
        run: |
          last="$(git describe --tags --abbrev=0 --match 'v[0-9]*.[0-9]*.[0-9]*' 2>/dev/null || true)"
          if [ -z "$last" ]; then
            next="1.0.0"
          elif [ "$(git rev-list -n 1 "$last")" = "$GITHUB_SHA" ]; then
            echo "This commit is already released as $last."
            echo "skip=1" >> "$GITHUB_OUTPUT"
            exit 0
          else
            log="$(git log --format='%s%n%b' "$last..HEAD")"
            IFS=. read -r major minor patch <<< "${last#v}"
            if grep -qE '^[a-z]+(\([^)]*\))?!:|BREAKING CHANGE' <<< "$log"; then
              major=$((major + 1)); minor=0; patch=0
            elif grep -qE '^feat(\([^)]*\))?:' <<< "$log"; then
              minor=$((minor + 1)); patch=0
            else
              patch=$((patch + 1))
            fi
            next="$major.$minor.$patch"
          fi
          echo "Next version: $next (last release: ${last:-none})"
          echo "version=$next" >> "$GITHUB_OUTPUT"

      - name: Build stagehand.zip
        if: steps.version.outputs.skip != '1'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          mkdir -p build
          git archive --format=tar --prefix=stagehand/ HEAD | tar -x -C build
          echo "$VERSION" > build/stagehand/VERSION
          cp build/stagehand/VERSION build/VERSION
          (cd build && zip -qr stagehand.zip stagehand)
          unzip -l build/stagehand.zip

      - name: Publish the release
        if: steps.version.outputs.skip != '1'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          gh release create "v$VERSION" build/stagehand.zip build/VERSION \
            --target "$GITHUB_SHA" \
            --title "Stagehand $VERSION" \
            --generate-notes
